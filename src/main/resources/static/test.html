<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Personality Test — CareerDNA</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--card:#1a1a24;--border:rgba(255,255,255,0.07);--text:#e8e8f0;--muted:#6b6b80;--accent-a:#7c6aff;--accent-b:#ff6a9e;--accent-c:#6affcc;--accent-d:#ffb86a;--accent-e:#6aaeff;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2.5rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,15,0.9);backdrop-filter:blur(20px);z-index:100;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;background:linear-gradient(135deg,var(--accent-a),var(--accent-b));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}
.nav-right{display:flex;align-items:center;gap:1rem;}
.btn-sm{padding:0.5rem 1rem;border-radius:7px;font-size:0.82rem;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;text-decoration:none;}

.wrapper{max-width:680px;margin:0 auto;padding:3rem 1.5rem;}

/* PROGRESS */
.progress-section{margin-bottom:2.5rem;}
.progress-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;}
.progress-label{font-size:0.82rem;color:var(--muted);}
.progress-num{font-family:'Syne',sans-serif;font-size:0.9rem;font-weight:700;}
.progress-bar{height:4px;background:var(--border);border-radius:100px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-a),var(--accent-b));border-radius:100px;transition:width 0.5s ease;}

/* QUESTION */
.question-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2.5rem;margin-bottom:1.5rem;}
.question-number{font-size:0.75rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem;}
.question-text{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:700;line-height:1.3;letter-spacing:-0.01em;margin-bottom:2rem;}

/* OPTIONS */
.options{display:flex;flex-direction:column;gap:0.75rem;}
.option{
  display:flex;align-items:center;gap:1rem;
  padding:1rem 1.25rem;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:12px;cursor:pointer;transition:all 0.2s;
}
.option:hover{border-color:var(--accent-a);background:rgba(124,106,255,0.05);}
.option.selected{border-color:var(--accent-a);background:rgba(124,106,255,0.1);}
.option-icon{font-size:1.4rem;width:40px;text-align:center;flex-shrink:0;}
.option-text{font-size:0.9rem;line-height:1.4;}
.option-check{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;transition:all 0.2s;display:flex;align-items:center;justify-content:center;}
.option.selected .option-check{background:var(--accent-a);border-color:var(--accent-a);}
.option.selected .option-check::after{content:'✓';color:#fff;font-size:0.7rem;font-weight:700;}

/* NAV BTNS */
.nav-buttons{display:flex;justify-content:space-between;align-items:center;gap:1rem;}
.btn{padding:0.8rem 1.75rem;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:500;font-size:0.9rem;cursor:pointer;border:none;transition:all 0.2s;}
.btn-prev{background:var(--surface);border:1px solid var(--border);color:var(--muted);}
.btn-prev:hover{border-color:var(--accent-a);color:var(--text);}
.btn-next{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));color:#fff;}
.btn-next:hover{opacity:0.9;transform:translateY(-1px);}
.btn-next:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.btn-submit{background:linear-gradient(135deg,var(--accent-c),var(--accent-a));color:#000;font-weight:600;}

/* CATEGORY LEGEND */
.legend{display:flex;flex-wrap:wrap;gap:0.6rem;margin-bottom:2rem;}
.legend-item{display:flex;align-items:center;gap:0.35rem;font-size:0.75rem;color:var(--muted);}
.legend-dot{width:8px;height:8px;border-radius:50%;}

/* LOADING */
.loading{text-align:center;padding:4rem 2rem;}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent-a);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem;}
@keyframes spin{to{transform:rotate(360deg);}}

@keyframes slideIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
.slide-in{animation:slideIn 0.3s ease;}
</style>
</head>
<body>
<nav>
  <a href="../index.html" class="logo">CareerDNA</a>
  <div class="nav-right">
    <span id="nav-username" style="font-size:0.85rem;color:var(--muted)"></span>
    <a href="dashboard.html" class="btn-sm">Dashboard</a>
  </div>
</nav>

<div class="wrapper">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p style="color:var(--muted)">Loading questions...</p>
  </div>

  <div id="test-container" style="display:none">
    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-meta">
        <span class="progress-label">Personality Assessment</span>
        <span class="progress-num" id="progress-num">1 / 8</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:12.5%"></div>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#7c6aff"></div> Analytical</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ff6a9e"></div> Creative</div>
      <div class="legend-item"><div class="legend-dot" style="background:#6affcc"></div> Social</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ffb86a"></div> Leadership</div>
      <div class="legend-item"><div class="legend-dot" style="background:#6aaeff"></div> Practical</div>
    </div>

    <!-- Question Card -->
    <div class="question-card slide-in" id="question-card">
      <div class="question-number" id="q-num"></div>
      <div class="question-text" id="q-text"></div>
      <div class="options" id="q-options"></div>
    </div>

    <div class="nav-buttons">
      <button class="btn btn-prev" id="btn-prev" onclick="prevQuestion()">← Back</button>
      <button class="btn btn-next" id="btn-next" onclick="nextQuestion()" disabled>Next →</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
if (!isLoggedIn()) window.location.href = 'login.html';

const user = getUser();
if (user) document.getElementById('nav-username').textContent = user.username;

let questions = [];
let current = 0;
let answers = {}; // questionId -> answerId

const ICONS = ['🔬','🎨','🤝','🚀','🔧'];

async function loadQuestions() {
  try {
    questions = await fetch('http://localhost:8080/api/questions').then(res => res.json());
    document.getElementById('loading').style.display = 'none';
    document.getElementById('test-container').style.display = 'block';
    renderQuestion();
  } catch(e) {
    document.getElementById('loading').innerHTML = `<p style="color:#ff8080">Failed to load questions. Is the backend running?</p>`;
  }
}

function renderQuestion() {
  const q = questions[current];
  const card = document.getElementById('question-card');
  card.classList.remove('slide-in');
  void card.offsetWidth;
  card.classList.add('slide-in');

  document.getElementById('q-num').textContent = `Question ${current + 1} of ${questions.length}`;
  document.getElementById('q-text').textContent = q.questionText;

  const selectedAnswer = answers[q.id];

  document.getElementById('q-options').innerHTML = q.answers.map((a, i) => `
    <div class="option ${selectedAnswer === a.id ? 'selected' : ''}"
         onclick="selectAnswer(${q.id}, ${a.id}, this)">
      <div class="option-icon">${ICONS[i] || '●'}</div>
      <div class="option-text">${a.answerText}</div>
      <div class="option-check"></div>
    </div>
  `).join('');

  // Update progress
  document.getElementById('progress-num').textContent = `${current + 1} / ${questions.length}`;
  document.getElementById('progress-fill').style.width = `${((current + 1) / questions.length) * 100}%`;

  document.getElementById('btn-prev').style.visibility = current === 0 ? 'hidden' : 'visible';

  const isLast = current === questions.length - 1;
  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = isLast ? '✦ Submit Test' : 'Next →';
  nextBtn.className = `btn ${isLast ? 'btn-submit' : 'btn-next'}`;
  nextBtn.disabled = !answers[q.id];
}

function selectAnswer(questionId, answerId, el) {
  answers[questionId] = answerId;
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('btn-next').disabled = false;
}

function nextQuestion() {
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    submitTest();
  }
}

function prevQuestion() {
  if (current > 0) { current--; renderQuestion(); }
}

async function submitTest() {
  if (Object.keys(answers).length < questions.length) {
    alert('Please answer all questions before submitting.');
    return;
  }

  document.getElementById('test-container').innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <p style="color:var(--muted)">Calculating your personality type...</p>
    </div>`;

  try {
    // Convert answer ids to strings for the API
    const answersPayload = {};
    Object.entries(answers).forEach(([qId, aId]) => {
      answersPayload[qId] = aId;
    });

    const result = await TestAPI.submit(answersPayload);
    // Store result and redirect
    sessionStorage.setItem('testResult', JSON.stringify(result));
    window.location.href = 'results.html';
  } catch(e) {
    alert('Error submitting test: ' + e.message);
    window.location.reload();
  }
}

loadQuestions();
</script>
</body>
</html>
