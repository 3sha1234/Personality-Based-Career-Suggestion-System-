<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — CareerDNA</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--card:#1a1a24;--border:rgba(255,255,255,0.07);--text:#e8e8f0;--muted:#6b6b80;--accent-a:#7c6aff;--accent-b:#ff6a9e;--accent-c:#6affcc;--accent-d:#ffb86a;--accent-e:#6aaeff;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2.5rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,15,0.9);backdrop-filter:blur(20px);z-index:100;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;background:linear-gradient(135deg,var(--accent-a),var(--accent-b));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;}
.nav-links{display:flex;gap:1rem;align-items:center;}
.btn-sm{padding:0.5rem 1rem;border-radius:7px;font-size:0.82rem;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;text-decoration:none;transition:all 0.2s;}
.btn-sm:hover{border-color:var(--accent-a);color:var(--text);}
.btn-danger{border-color:rgba(255,80,80,0.3);color:rgba(255,80,80,0.7);}
.btn-danger:hover{border-color:#ff5050;color:#ff5050;}

.wrapper{max-width:960px;margin:0 auto;padding:3rem 1.5rem;}

/* GREETING */
.greeting{margin-bottom:2.5rem;}
.greeting-sub{color:var(--muted);font-size:0.88rem;margin-bottom:0.5rem;}
.greeting h1{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;letter-spacing:-0.02em;}
.greeting span{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:2rem;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.25rem 1.5rem;}
.stat-label{font-size:0.75rem;color:var(--muted);margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.08em;}
.stat-value{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;}

/* PERSONALITY RESULT */
.result-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2rem;margin-bottom:2rem;position:relative;overflow:hidden;}
.result-card::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;filter:blur(60px);pointer-events:none;}
.rc-top{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;}
.rc-icon{font-size:2.5rem;}
.rc-info h3{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:0.2rem;}
.rc-info p{font-size:0.82rem;color:var(--muted);}

.score-bars{display:flex;flex-direction:column;gap:0.75rem;margin-top:1.25rem;}
.score-row{display:flex;align-items:center;gap:0.75rem;}
.score-label{width:100px;font-size:0.8rem;color:var(--muted);}
.score-track{flex:1;height:8px;background:var(--surface);border-radius:100px;overflow:hidden;}
.score-fill{height:100%;border-radius:100px;}
.score-val{width:30px;text-align:right;font-size:0.75rem;color:var(--muted);}

/* HISTORY */
.history-section{margin-top:2rem;}
.section-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:1rem;}
.history-item{display:flex;align-items:center;justify-content:space-between;padding:1rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:0.5rem;}
.hi-left{display:flex;align-items:center;gap:0.75rem;}
.hi-badge{font-size:0.75rem;padding:0.2rem 0.6rem;border-radius:5px;font-weight:600;}
.hi-date{font-size:0.78rem;color:var(--muted);}
.hi-right{font-size:0.78rem;color:var(--muted);}

/* CTA */
.cta-card{background:linear-gradient(135deg,rgba(124,106,255,0.1),rgba(255,106,158,0.1));border:1px solid rgba(124,106,255,0.2);border-radius:20px;padding:2rem;text-align:center;}
.cta-card h3{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:0.5rem;}
.cta-card p{font-size:0.85rem;color:var(--muted);margin-bottom:1.5rem;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.75rem 1.5rem;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:500;font-size:0.9rem;cursor:pointer;border:none;text-decoration:none;transition:all 0.2s;}
.btn-primary{background:linear-gradient(135deg,var(--accent-a),var(--accent-b));color:#fff;}
.btn-primary:hover{opacity:0.9;transform:translateY(-1px);}
</style>
</head>
<body>
<nav>
  <a href="../index.html" class="logo">CareerDNA</a>
  <div class="nav-links">
    <a href="test.html" class="btn-sm">Take Test</a>
    <a href="careers.html" class="btn-sm">Browse Careers</a>
    <button class="btn-sm btn-danger" onclick="logout()">Log Out</button>
  </div>
</nav>

<div class="wrapper">
  <div class="greeting">
    <div class="greeting-sub">Welcome back</div>
    <h1>Hello, <span id="user-name">there</span> 👋</h1>
  </div>

  <div id="dashboard-content">
    <p style="color:var(--muted)">Loading your dashboard...</p>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
if (!isLoggedIn()) window.location.href = 'login.html';
const user = getUser();
if (user) document.getElementById('user-name').textContent = user.fullName || user.username;

const P_STYLES = {
  ANALYTICAL: {color:'#7c6aff',bg:'rgba(124,106,255,0.1)',icon:'🔬',label:'Analytical'},
  CREATIVE:   {color:'#ff6a9e',bg:'rgba(255,106,158,0.1)',icon:'🎨',label:'Creative'},
  SOCIAL:     {color:'#6affcc',bg:'rgba(106,255,204,0.1)',icon:'🤝',label:'Social'},
  LEADERSHIP: {color:'#ffb86a',bg:'rgba(255,184,106,0.1)',icon:'🚀',label:'Leadership'},
  PRACTICAL:  {color:'#6aaeff',bg:'rgba(106,174,255,0.1)',icon:'🔧',label:'Practical'},
};

async function loadDashboard() {
  const content = document.getElementById('dashboard-content');
  try {
    const [latest, history] = await Promise.all([
      TestAPI.getLatest().catch(() => null),
      TestAPI.getHistory().catch(() => []),
    ]);

    if (!latest) {
      content.innerHTML = `
        <div class="cta-card">
          <h3>No test results yet</h3>
          <p>Take our 8-question personality assessment to discover your ideal career path.</p>
          <a href="test.html" class="btn btn-primary">Start the Test →</a>
        </div>`;
      return;
    }

    const ps = P_STYLES[latest.dominantPersonality] || P_STYLES.ANALYTICAL;
    const total = latest.analyticalScore + latest.creativeScore + latest.socialScore + latest.leadershipScore + latest.practicalScore;

    const scoreData = [
      {label:'Analytical',value:latest.analyticalScore,color:'#7c6aff'},
      {label:'Creative',value:latest.creativeScore,color:'#ff6a9e'},
      {label:'Social',value:latest.socialScore,color:'#6affcc'},
      {label:'Leadership',value:latest.leadershipScore,color:'#ffb86a'},
      {label:'Practical',value:latest.practicalScore,color:'#6aaeff'},
    ];

    content.innerHTML = `
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Personality Type</div>
          <div class="stat-value" style="color:${ps.color}">${ps.icon} ${ps.label}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Tests Taken</div>
          <div class="stat-value">${history.length}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Score Points</div>
          <div class="stat-value">${total}</div>
        </div>
      </div>

      <div class="result-card" style="border-color:${ps.color}30">
        <div style="content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;filter:blur(60px);background:${ps.bg};pointer-events:none"></div>
        <div class="rc-top">
          <div class="rc-icon">${ps.icon}</div>
          <div class="rc-info">
            <h3>You are ${ps.label}</h3>
            <p>Latest result · ${new Date(latest.takenAt).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</p>
          </div>
        </div>
        <div class="score-bars">
          ${scoreData.map(s => `
            <div class="score-row">
              <div class="score-label">${s.label}</div>
              <div class="score-track">
                <div class="score-fill" style="width:${total ? Math.round((s.value/total)*100) : 0}%;background:${s.color}"></div>
              </div>
              <div class="score-val">${s.value}</div>
            </div>`).join('')}
        </div>
      </div>

      <div style="display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap">
        <a href="results.html" class="btn btn-primary" onclick="loadLatestToSession()">View Full Results</a>
        <a href="test.html" class="btn" style="border:1px solid var(--border);background:transparent;color:var(--text)">Retake Test</a>
        <a href="careers.html" class="btn" style="border:1px solid var(--border);background:transparent;color:var(--text)">Browse Careers</a>
      </div>

      ${history.length > 1 ? `
        <div class="history-section">
          <div class="section-title">Test History</div>
          ${history.slice(0, 5).map(h => {
            const hps = P_STYLES[h.dominantPersonality] || P_STYLES.ANALYTICAL;
            return `
              <div class="history-item">
                <div class="hi-left">
                  <span class="hi-badge" style="background:${hps.bg};color:${hps.color}">${hps.icon} ${hps.label}</span>
                  <span class="hi-date">${new Date(h.takenAt).toLocaleDateString()}</span>
                </div>
                <div class="hi-right">Score: ${h.analyticalScore+h.creativeScore+h.socialScore+h.leadershipScore+h.practicalScore} pts</div>
              </div>`;
          }).join('')}
        </div>` : ''}
    `;

  } catch(e) {
    content.innerHTML = `<p style="color:#ff8080">Error loading dashboard: ${e.message}</p>`;
  }
}

function loadLatestToSession() {
  // Results page reads from sessionStorage — we'll re-submit isn't needed, just navigate
}

loadDashboard();
</script>
</body>
</html>
